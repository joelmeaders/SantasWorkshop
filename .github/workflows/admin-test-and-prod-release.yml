name: Admin Test Deploy and Manual Prod Release
'on':
  push:
    branches:
    - master
    paths:
    - santashop-admin/**
    - santashop-core/**
    - santashop-models/**
    - remote-config/**
    - scripts/remote-config*.cjs
    - scripts/public-parameters-schema.cjs
    - scripts/verify-public-parameters.cjs
    - angular.json
    - vitest.config.mjs
    - vitest.setup.ts
    - test-helpers/**
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - config.firebase.cjs
    - firebase.json
    - firebase.e2e.json
    - firestore.rules
    - scripts/env-loader.cjs
    - scripts/verify-hosting-styles.mjs
    - scripts/verify-admin-initial-bundle.mjs
    - santashop-e2e/fixtures/**
    - santashop-e2e/scripts/**
    - santashop-e2e/tests/admin/**
    - santashop-e2e/playwright.config.ts
    - .github/workflows/admin-test-and-prod-release.yml
    - .github/workflows/app-pr-validation.yml
    - .github/workflows/ui-target.yml
  workflow_dispatch:
    inputs:
      release_ref:
        description: Commit SHA or ref to promote after test validation
        required: true
        type: string
      deployment_target:
        description: Deployment target
        required: true
        default: prod
        type: choice
        options:
        - test
        - prod
      skip_tests:
        description: Skip test suites for this manual deployment
        required: true
        default: false
        type: boolean
permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/ui-target.yml
    with:
      target: admin
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_target || 'test' }}
      release_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.sha }}
      deploy: true
      skip_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests || false }}
    secrets:
      TEST_FIREBASE_API_KEY: ${{ secrets.TEST_FIREBASE_API_KEY }}
      PROD_FIREBASE_API_KEY: ${{ secrets.PROD_FIREBASE_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_TEST: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_TEST }}
      FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_193B5: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_193B5 }}
