name: Admin Test Deploy and Manual Prod Release
'on':
  push:
    branches:
      - master
    paths:
      - 'santashop-admin/**'
      - 'santashop-core/**'
      - 'santashop-models/**'
      - 'angular.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'config.firebase.cjs'
      - 'firebase.e2e.json'
      - 'firestore.rules'
      - 'scripts/env-loader.cjs'
      - 'scripts/verify-admin-initial-bundle.mjs'
      - 'santashop-e2e/fixtures/**'
      - 'santashop-e2e/scripts/**'
      - 'santashop-e2e/tests/admin/**'
      - 'santashop-e2e/playwright.config.ts'
      - '.github/workflows/admin-test-and-prod-release.yml'
      - '.github/workflows/admin-pr-validation.yml'

  workflow_dispatch:
    inputs:
      release_ref:
        description: Commit SHA or ref to promote after test validation
        required: true
        type: string

permissions:
  contents: read

env:
  LOCAL_AWS_ACCESS_KEY_ID: e2e-not-used
  LOCAL_AWS_SECRET_ACCESS_KEY: e2e-not-used
  LOCAL_FIRESTORE_BACKUP_BUCKET: gs://demo-santashop-backups
  LOCAL_REGISTRATION_EMAIL_RETURN_PATH: admin@example.invalid
  LOCAL_REGISTRATION_EMAIL_SOURCE: no-reply@example.invalid
  LOCAL_REMINDER_EMAIL_SENDING_STALE_MINUTES: '15'
  LOCAL_SANTASHOP_DEFAULT_MAX_SLOTS: '350'
  LOCAL_SANTASHOP_EVENT_DISPLAY_NAME: 2026 Denver Santa Claus Shop E2E
  LOCAL_SANTASHOP_EVENT_MIN_INSTANCES: '0'
  LOCAL_SANTASHOP_PROGRAM_YEAR: '2026'
  LOCAL_SANTASHOP_SHOP_DAYS: 12-12,12-13,12-15,12-16
  LOCAL_SANTASHOP_SIGNUP_MIN_INSTANCES: '0'
  LOCAL_SANTASHOP_TIME_OFFSET: '-07:00'
  LOCAL_SANTASHOP_TIME_ZONE: America/Denver
  LOCAL_SCHEDULED_CHECKIN_STATS: '*/5 10,11,12,13,14,15,16 12,13,15,16 12 *'
  LOCAL_SCHEDULED_DATETIME_SLOT_COUNTERS: '*/5 * * 11,12 *'
  LOCAL_SCHEDULED_FIRESTORE_BACKUP: 0 0 * 11,12 *
  LOCAL_SCHEDULED_REGISTRATION_STATS: 59 23 * * *
  LOCAL_SCHEDULED_USER_STATS: 55 23 * 11,12 *
  LOCAL_SES_REGION: us-west-2
  TEST_SANTASHOP_PROGRAM_YEAR: '2026'
  TEST_SANTASHOP_SHOP_DAYS: 12-12,12-13,12-15,12-16

jobs:
  deploy_test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      TEST_FIREBASE_API_KEY: ${{ secrets.TEST_FIREBASE_API_KEY }}
      TEST_FIREBASE_AUTH_DOMAIN: santas-workshop-test.firebaseapp.com
      TEST_FIREBASE_DATABASE_URL: https://santas-workshop-test-default-rtdb.firebaseio.com
      TEST_FIREBASE_PROJECT_ID: santas-workshop-test
      TEST_FIREBASE_STORAGE_BUCKET: santas-workshop-test.appspot.com
      TEST_FIREBASE_MESSAGING_SENDER_ID: '312672416598'
      TEST_FIREBASE_APP_ID: '1:312672416598:web:75721875d43341bef29cf7'
      TEST_FIREBASE_MEASUREMENT_ID: G-4FQR667VT9
      TEST_SANTASHOP_PROGRAM_YEAR: '2026'
      TEST_SANTASHOP_SHOP_DAYS: 12-12,12-13,12-15,12-16
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.14.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Run security audit (informational)
        id: security_audit
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm run audit:security 2>&1 | tee "$RUNNER_TEMP/security-audit.log"
      - name: Report security audit findings
        if: always() && steps.security_audit.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "::warning::Security audit reported findings or could not complete. Review the job summary and audit log."
          {
            echo '### Security audit requires review'
            echo 'This audit is informational and does not block validation or deployment.'
            echo '```text'
            cat "$RUNNER_TEMP/security-audit.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm run e2e:browser:setup:ci
      - run: pnpm run e2e:test:admin
      - name: Upload admin E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-test-deploy-e2e-failure-${{ github.run_id }}
          path: |
            santashop-e2e/test-results
            santashop-e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm run ci:admin:config:test
      - run: pnpm run ci:core:test
      - run: pnpm run ci:admin:test
      - run: pnpm run ci:admin:build:test
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets[format(''FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_{0}'', ''TEST'')] }}'
          channelId: live
          target: santashop-admin
          projectId: santas-workshop-test
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels

  deploy_prod:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PROD_FIREBASE_API_KEY: ${{ secrets.PROD_FIREBASE_API_KEY }}
      PROD_FIREBASE_AUTH_DOMAIN: santas-workshop-193b5.firebaseapp.com
      PROD_FIREBASE_DATABASE_URL: https://santas-workshop-193b5.firebaseio.com
      PROD_FIREBASE_PROJECT_ID: santas-workshop-193b5
      PROD_FIREBASE_STORAGE_BUCKET: santas-workshop-193b5.appspot.com
      PROD_FIREBASE_MESSAGING_SENDER_ID: '397997267986'
      PROD_FIREBASE_APP_ID: '1:397997267986:web:8c85e08550793dd348cccb'
      PROD_FIREBASE_MEASUREMENT_ID: G-0KHS1T1W85
      PROD_SANTASHOP_PROGRAM_YEAR: '2026'
      PROD_SANTASHOP_SHOP_DAYS: 12-12,12-13,12-15,12-16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: '10.14.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Run security audit (informational)
        id: security_audit
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm run audit:security 2>&1 | tee "$RUNNER_TEMP/security-audit.log"
      - name: Report security audit findings
        if: always() && steps.security_audit.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "::warning::Security audit reported findings or could not complete. Review the job summary and audit log."
          {
            echo '### Security audit requires review'
            echo 'This audit is informational and does not block validation or deployment.'
            echo '```text'
            cat "$RUNNER_TEMP/security-audit.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm run e2e:browser:setup:ci
      - run: pnpm run e2e:test:admin
      - name: Upload admin E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-prod-release-e2e-failure-${{ github.run_id }}
          path: |
            santashop-e2e/test-results
            santashop-e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm run ci:admin:config:prod
      - run: pnpm run ci:core:test
      - run: pnpm run ci:admin:test
      - run: pnpm run ci:admin:build:prod
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets[format(''FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_{0}'', ''193B5'')] }}'
          channelId: live
          target: santashop-admin
          projectId: santas-workshop-193b5
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
