name: PR Validation
'on':
  pull_request: null
permissions:
  contents: read
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  targets:
    uses: ./.github/workflows/ci-changes.yml
  shared:
    runs-on: ubuntu-latest
    env:
      TEST_SANTASHOP_PROGRAM_YEAR: '2026'
      TEST_SANTASHOP_SHOP_DAYS: 12-12,12-13,12-15,12-16
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run e2e:browser:setup:ci
      - run: pnpm run config:app:e2e && pnpm run config:admin:e2e
      - run: pnpm run ci:ui:shared
    needs: targets
    if: needs.targets.outputs.shared == 'true'
  ui:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.ui_matrix) }}
    uses: ./.github/workflows/ui-target.yml
    with:
      target: ${{ matrix.target }}
      mode: test
      release_ref: ${{ github.sha }}
      shared_tests: false
    secrets:
      TEST_FIREBASE_API_KEY: ${{ secrets.TEST_FIREBASE_API_KEY }}
    if: needs.targets.outputs.ui == 'true'
  functions:
    needs: targets
    if: needs.targets.outputs.functions == 'true'
    uses: ./.github/workflows/functions-pr-validation.yml
  e2e:
    needs:
      - targets
      - shared
      - ui
      - functions
      - tooling
    if: always() && !cancelled() && needs.targets.result == 'success' && needs.targets.outputs.e2e == 'true' && ((needs.targets.outputs.shared == 'true' && needs.shared.result == 'success') || (needs.targets.outputs.shared == 'false' && needs.shared.result == 'skipped')) && ((needs.targets.outputs.ui == 'true' && needs.ui.result == 'success') || (needs.targets.outputs.ui == 'false' && needs.ui.result == 'skipped')) && ((needs.targets.outputs.functions == 'true' && needs.functions.result == 'success') || (needs.targets.outputs.functions == 'false' && needs.functions.result == 'skipped')) && ((needs.targets.outputs.tooling == 'true' && needs.tooling.result == 'success') || (needs.targets.outputs.tooling == 'false' && needs.tooling.result == 'skipped'))
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.e2e_matrix) }}
    uses: ./.github/workflows/e2e-target.yml
    with:
      target: ${{ matrix.target }}
      release_ref: ${{ github.sha }}
  build_validation:
    if: always()
    needs:
      - targets
      - tooling
      - shared
      - ui
      - functions
      - e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require every selected PR check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-results.mjs
  tooling:
    needs: targets
    if: needs.targets.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/ci-*.test.mjs scripts/ui-targets.test.mjs scripts/release-*.test.mjs scripts/storybook-targets.test.mjs scripts/load/*.test.mjs
      - name: Test secret synchronization without credentials or network writes
        shell: pwsh
        run: ./scripts/github-secrets.test.ps1
