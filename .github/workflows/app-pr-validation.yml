name: UI PR Validation
on:
  pull_request:
    paths:
      - 'santashop-app/**'
      - 'santashop-core/**'
      - 'santashop-models/**'
      - 'remote-config/**'
      - 'scripts/remote-config*.cjs'
      - 'scripts/public-parameters-schema.cjs'
      - 'scripts/verify-public-parameters.cjs'
      - '.storybook/**'
      - 'angular.json'
      - 'eslint.config.js'
      - 'vitest.config.mjs'
      - 'vitest.setup.ts'
      - 'test-helpers/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'config.firebase.cjs'
      - 'firebase.json'
      - 'firebase.e2e.json'
      - 'firestore.rules'
      - 'storage.rules'
      - 'santashop-e2e/fixtures/**'
      - 'santashop-e2e/scripts/**'
      - 'santashop-e2e/tests/public/**'
      - 'santashop-e2e/playwright.config.ts'
      - 'scripts/env-loader.cjs'
      - 'tsconfig.storybook.json'
      - 'vitest.storybook.config.ts'
      - 'scripts/verify-hosting-styles.mjs'
      - '.github/workflows/app-pr-validation.yml'
      - '.github/workflows/app-test-and-prod-release.yml'
      - 'santashop-admin/**'
      - 'scripts/verify-admin-initial-bundle.mjs'
      - 'santashop-e2e/tests/admin/**'
      - '.github/workflows/admin-test-and-prod-release.yml'
      - '.github/workflows/ui-target.yml'
      - 'scripts/ui-targets*.mjs'
      - 'scripts/github-secrets*.ps1'
      - 'tsconfig.json'
      - 'storybook-visual/**'
      - 'scripts/verify-hosting-cache.mjs'

permissions:
  contents: read
concurrency:
  group: ui-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          matrix=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | node scripts/ui-targets.mjs)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  shared:
    runs-on: ubuntu-latest
    env:
      TEST_SANTASHOP_PROGRAM_YEAR: '2026'
      TEST_SANTASHOP_SHOP_DAYS: 12-12,12-13,12-15,12-16
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/ui-targets.test.mjs
      - name: Test secret synchronization without credentials or network writes
        shell: pwsh
        run: ./scripts/github-secrets.test.ps1
      - run: pnpm run e2e:browser:setup:ci
      - run: pnpm run config:app:e2e && pnpm run config:admin:e2e
      - run: pnpm run ci:ui:shared
  ui:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    uses: ./.github/workflows/ui-target.yml
    with:
      target: ${{ matrix.target }}
      mode: test
      release_ref: ${{ github.sha }}
      shared_tests: false
    secrets:
      TEST_FIREBASE_API_KEY: ${{ secrets.TEST_FIREBASE_API_KEY }}
  build_validation:
    if: always()
    needs: [targets, shared, ui]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected UI and shared check
        run: |
          test '${{ needs.targets.result }}' = success
          test '${{ needs.shared.result }}' = success
          test '${{ needs.ui.result }}' = success
