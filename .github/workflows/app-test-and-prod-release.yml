name: App Test Deploy and Manual Prod Release
'on':
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_ref:
        description: Release tag, branch, or commit to deploy (must be on master)
        required: true
        type: string
      deployment_target:
        description: Deployment target
        required: true
        default: prod
        type: choice
        options:
          - test
          - prod
permissions:
  contents: read
  actions: read
jobs:
  changes:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci-changes.yml
  prepare_release:
    uses: ./.github/workflows/release-gate.yml
    with:
      target: app
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_target || 'test' }}
      release_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.sha }}
    needs: changes
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.changes.result == 'success' && needs.changes.outputs.deploy_app == 'true'))
  release:
    needs:
      - changes
      - prepare_release
    uses: ./.github/workflows/ui-target.yml
    with:
      target: app
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_target || 'test' }}
      release_ref: ${{ needs.prepare_release.outputs.sha }}
      deploy: true
      reuse_tests: ${{ needs.prepare_release.outputs.reuse_tests == 'true' }}
      shared_tests: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.shared == 'true' }}
    secrets:
      TEST_FIREBASE_API_KEY: ${{ secrets.TEST_FIREBASE_API_KEY }}
      PROD_FIREBASE_API_KEY: ${{ secrets.PROD_FIREBASE_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_TEST: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_TEST }}
      FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_193B5: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_193B5 }}
    if: always() && !cancelled() && needs.prepare_release.result == 'success'
