name: App Test Deploy and Manual Prod Release
'on':
  push:
    branches:
    - master
    paths:
    - santashop-app/**
    - santashop-core/**
    - santashop-models/**
    - remote-config/**
    - scripts/remote-config*.cjs
    - scripts/public-parameters-schema.cjs
    - scripts/verify-public-parameters.cjs
    - .storybook/**
    - angular.json
    - eslint.config.js
    - vitest.config.mjs
    - vitest.setup.ts
    - test-helpers/**
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - config.firebase.cjs
    - firebase.json
    - firebase.e2e.json
    - firestore.rules
    - storage.rules
    - santashop-e2e/fixtures/**
    - santashop-e2e/scripts/**
    - santashop-e2e/tests/public/**
    - santashop-e2e/playwright.config.ts
    - scripts/env-loader.cjs
    - tsconfig.storybook.json
    - vitest.storybook.config.ts
    - scripts/verify-hosting-styles.mjs
    - .github/workflows/app-test-and-prod-release.yml
    - .github/workflows/app-pr-validation.yml
    - .github/workflows/ui-target.yml
    - .github/workflows/release-gate.yml
    - scripts/release-*.mjs
  workflow_dispatch:
    inputs:
      release_ref:
        description: Release tag, branch, or commit to deploy (must be on master)
        required: true
        type: string
      deployment_target:
        description: Deployment target
        required: true
        default: prod
        type: choice
        options:
        - test
        - prod

permissions:
  contents: read
  actions: read

jobs:
  prepare_release:
    uses: ./.github/workflows/release-gate.yml
    with:
      target: app
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_target || 'test' }}
      release_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.sha }}

  release:
    needs: prepare_release
    uses: ./.github/workflows/ui-target.yml
    with:
      target: app
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_target || 'test' }}
      release_ref: ${{ needs.prepare_release.outputs.sha }}
      deploy: true
      reuse_tests: ${{ needs.prepare_release.outputs.reuse_tests == 'true' }}
    secrets:
      TEST_FIREBASE_API_KEY: ${{ secrets.TEST_FIREBASE_API_KEY }}
      PROD_FIREBASE_API_KEY: ${{ secrets.PROD_FIREBASE_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_TEST: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_TEST }}
      FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_193B5: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_193B5 }}
