name: App Test Deploy and Production Approval
'on':
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_ref:
        description: Release tag, branch, or commit to deploy (must be on master)
        required: true
        type: string
        default: master
      deployment_target:
        description: Stop after TEST, or continue to production approval
        required: true
        default: prod
        type: choice
        options:
          - test
          - prod
      skip_tests:
        description: Emergency fix - skip test suites, then deploy TEST and request production approval
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  changes:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci-changes.yml
  prepare_release:
    uses: ./.github/workflows/release-gate.yml
    with:
      target: app
      mode: test
      skip_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests || false }}
      commit_message: ${{ github.event_name == 'push' && github.event.head_commit.message || '' }}
      release_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.sha }}
    needs: changes
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.changes.result == 'success' && needs.changes.outputs.deploy_app == 'true'))
  release:
    needs:
      - changes
      - prepare_release
    uses: ./.github/workflows/ui-target.yml
    with:
      target: app
      mode: test
      release_ref: ${{ needs.prepare_release.outputs.sha }}
      deploy: true
      skip_tests: ${{ needs.prepare_release.outputs.skip_tests == 'true' }}
      shared_tests: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.shared == 'true' }}
    secrets:
      TEST_FIREBASE_API_KEY: ${{ secrets.TEST_FIREBASE_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_TEST: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_TEST }}
    if: always() && !cancelled() && needs.prepare_release.result == 'success'
  deploy_prod:
    needs:
      - prepare_release
      - release
    if: always() && !cancelled() && needs.prepare_release.result == 'success' && needs.release.result == 'success' && (github.event_name == 'push' || inputs.deployment_target == 'prod')
    uses: ./.github/workflows/ui-target.yml
    with:
      target: app
      mode: prod
      release_ref: ${{ needs.prepare_release.outputs.sha }}
      deploy: true
      skip_tests: ${{ needs.prepare_release.outputs.skip_tests == 'true' }}
    secrets:
      PROD_FIREBASE_API_KEY: ${{ secrets.PROD_FIREBASE_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_193B5: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_193B5 }}
