name: Dependency review
on:
  pull_request:
    paths:
      - '**/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/dependency-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency_review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ordinary audit output for the dependency-change review
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm audit 2>&1 | tee "$RUNNER_TEMP/dependency-audit.log"
      - name: Identify review ownership and incomplete checks
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          echo 'Dependency review owner: repository maintainer Joel Meaders. Review this output before merging dependency changes; no advisories are automatically declared safe.' >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUDIT_OUTCOME" != success ]; then
            echo '::warning::Dependency audit reported findings or did not complete. Maintainer review is required; this informational job does not replace the blocking Functions deploy-artifact audit.'
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/dependency-audit.log
          if-no-files-found: ignore
          retention-days: 7
