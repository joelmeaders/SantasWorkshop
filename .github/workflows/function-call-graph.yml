name: Function Call Graph

on:
    pull_request:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    call_graph:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: '10.14.0'
            - uses: actions/setup-node@v7
              with:
                  node-version: '24.18.0'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run functions:graph:test
            - run: pnpm run functions:graph:check
