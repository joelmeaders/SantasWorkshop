name: Functions PR checks
on:
  workflow_call:

# The PR caller owns cancellation and the single browser-suite matrix.
permissions:
  contents: read

env:
  # Validation artifacts and emulators never receive usable AWS credentials.
  TEST_AWS_ACCESS_KEY_ID: ci-not-used
  TEST_AWS_SECRET_ACCESS_KEY: ci-not-used
  TEST_SANTASHOP_PROGRAM_YEAR: '2026'
  TEST_SANTASHOP_TIME_ZONE: America/Denver
  TEST_SANTASHOP_SHOP_DAYS: 12-12,12-13,12-15,12-16
  TEST_SANTASHOP_DEFAULT_MAX_SLOTS: '350'
  TEST_FIRESTORE_BACKUP_BUCKET: gs://santashop-backups
  TEST_SES_REGION: us-west-2
  TEST_SANTASHOP_EVENT_DISPLAY_NAME: 2026 Denver Santa Claus Shop
  TEST_SANTASHOP_PASSWORD_RESET_CONTINUE_URL: https://test.denversantaclausshop.org/?mode=sign-in
  TEST_REMINDER_EMAIL_SENDING_STALE_MINUTES: '15'
  TEST_SANTASHOP_SIGNUP_MIN_INSTANCES: '0'
  TEST_SANTASHOP_EVENT_MIN_INSTANCES: '0'
  TEST_SANTASHOP_FUNCTIONS_SERVICE_ACCOUNT: 312672416598-compute@developer.gserviceaccount.com
  TEST_REGISTRATION_EMAIL_SOURCE: noreply@denversantaclausshop.org
  TEST_REGISTRATION_EMAIL_RETURN_PATH: admin@denversantaclausshop.org
  TEST_SCHEDULED_FIRESTORE_BACKUP: 0 0 * 11,12 *
  TEST_SCHEDULED_DATETIME_SLOT_COUNTERS: '*/5 * * 11,12 *'
  TEST_SCHEDULED_REGISTRATION_STATS: 59 23 * * *
  TEST_SCHEDULED_USER_STATS: 55 23 * 11,12 *
  TEST_SCHEDULED_CHECKIN_STATS: '*/5 10,11,12,13,14,15,16 12,13,15,16 12 *'

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @santashop/functions run lint:check
      - run: pnpm run functions:test:unit
      - name: Validate deploy artifact
        env:
          SANTASHOP_FUNCTIONS_DEPLOY: test
        run: |
          pnpm run config:functions:test
          pnpm --filter @santashop/functions build
          node scripts/prepare-functions-deploy.cjs
          npm --prefix .firebase-functions-deploy audit --omit=dev --audit-level=moderate

  integration_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run functions:test:integration
