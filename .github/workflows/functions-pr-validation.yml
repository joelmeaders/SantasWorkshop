name: Functions PR Validation

on:
  pull_request:
    paths:
      - 'santashop-functions/**'
      - 'santashop-models/**'
      - 'remote-config/**'
      - 'scripts/remote-config*.cjs'
      - 'scripts/public-parameters-schema.cjs'
      - 'santashop-e2e/**'
      - 'firebase.json'
      - 'firebase.e2e.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'database.rules.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.env.example'
      - 'config.functions.cjs'
      - 'scripts/env-loader.cjs'
      - 'scripts/assert-functions-deploy-ci.cjs'
      - 'scripts/prepare-functions-deploy.cjs'
      - 'scripts/verify-functions-parity.cjs'
      - 'scripts/verify-functions-managed-resources.cjs'
      - 'scripts/verify-public-parameters.cjs'
      - '.github/workflows/functions-pr-validation.yml'
      - '.github/workflows/functions-test-and-prod-release.yml'

permissions:
  contents: read

env:
  TEST_AWS_ACCESS_KEY_ID: ${{ secrets.TEST_AWS_ACCESS_KEY_ID }}
  TEST_AWS_SECRET_ACCESS_KEY: ${{ secrets.TEST_AWS_SECRET_ACCESS_KEY }}
  TEST_SANTASHOP_PROGRAM_YEAR: '2026'
  TEST_SANTASHOP_TIME_ZONE: America/Denver
  TEST_SANTASHOP_SHOP_DAYS: 12-12,12-13,12-15,12-16
  TEST_SANTASHOP_DEFAULT_MAX_SLOTS: '350'
  TEST_FIRESTORE_BACKUP_BUCKET: gs://santashop-backups
  TEST_SES_REGION: us-west-2
  TEST_SANTASHOP_EVENT_DISPLAY_NAME: 2026 Denver Santa Claus Shop
  TEST_SANTASHOP_PASSWORD_RESET_CONTINUE_URL: https://test.denversantaclausshop.org/?mode=sign-in
  TEST_REMINDER_EMAIL_SENDING_STALE_MINUTES: '15'
  TEST_SANTASHOP_SIGNUP_MIN_INSTANCES: '0'
  TEST_SANTASHOP_EVENT_MIN_INSTANCES: '0'
  TEST_SANTASHOP_FUNCTIONS_SERVICE_ACCOUNT: 312672416598-compute@developer.gserviceaccount.com
  TEST_REGISTRATION_EMAIL_SOURCE: noreply@denversantaclausshop.org
  TEST_REGISTRATION_EMAIL_RETURN_PATH: admin@denversantaclausshop.org
  TEST_SCHEDULED_FIRESTORE_BACKUP: 0 0 * 11,12 *
  TEST_SCHEDULED_DATETIME_SLOT_COUNTERS: '*/5 * * 11,12 *'
  TEST_SCHEDULED_REGISTRATION_STATS: 59 23 * * *
  TEST_SCHEDULED_USER_STATS: 55 23 * 11,12 *
  TEST_SCHEDULED_CHECKIN_STATS: '*/5 10,11,12,13,14,15,16 12,13,15,16 12 *'

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run security audit (informational)
        id: security_audit
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm run audit:security 2>&1 | tee "$RUNNER_TEMP/security-audit.log"
      - name: Report security audit findings
        if: always() && steps.security_audit.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "::warning::Security audit reported findings or could not complete. Review the job summary and audit log."
          {
            echo '### Security audit requires review'
            echo 'This audit is informational and does not block validation or deployment.'
            echo '```text'
            cat "$RUNNER_TEMP/security-audit.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm --filter @santashop/functions run lint:check
      - run: pnpm run functions:test:unit
      - name: Validate deploy artifact
        env:
          SANTASHOP_FUNCTIONS_DEPLOY: test
        run: |
          pnpm run config:functions:test
          pnpm --filter @santashop/functions build
          node scripts/prepare-functions-deploy.cjs
          npm --prefix .firebase-functions-deploy audit --omit=dev --audit-level=moderate

  integration_tests:
    needs: unit_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Check integration test prerequisites
        shell: bash
        run: |
          [ -n "$TEST_AWS_ACCESS_KEY_ID" ] || { echo "Missing TEST_AWS_ACCESS_KEY_ID"; exit 1; }
          [ -n "$TEST_AWS_SECRET_ACCESS_KEY" ] || { echo "Missing TEST_AWS_SECRET_ACCESS_KEY"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run functions:test:integration
      - run: pnpm run e2e:browser:setup:ci
      - name: Run customer and staff E2E tests
        env:
          LOCAL_AWS_ACCESS_KEY_ID: e2e-not-used
          LOCAL_AWS_SECRET_ACCESS_KEY: e2e-not-used
          LOCAL_FIRESTORE_BACKUP_BUCKET: gs://demo-santashop-backups
          LOCAL_REGISTRATION_EMAIL_RETURN_PATH: admin@example.invalid
          LOCAL_REGISTRATION_EMAIL_SOURCE: no-reply@example.invalid
          LOCAL_REMINDER_EMAIL_SENDING_STALE_MINUTES: '15'
          LOCAL_SANTASHOP_DEFAULT_MAX_SLOTS: '350'
          LOCAL_SANTASHOP_EVENT_DISPLAY_NAME: 2026 Denver Santa Claus Shop E2E
          LOCAL_SANTASHOP_PASSWORD_RESET_CONTINUE_URL: http://localhost:4100/?mode=sign-in
          LOCAL_SANTASHOP_EVENT_MIN_INSTANCES: '0'
          LOCAL_SANTASHOP_PROGRAM_YEAR: '2026'
          LOCAL_SANTASHOP_SHOP_DAYS: 12-12,12-13,12-15,12-16
          LOCAL_SANTASHOP_SIGNUP_MIN_INSTANCES: '0'
          LOCAL_SANTASHOP_TIME_ZONE: America/Denver
          LOCAL_SCHEDULED_CHECKIN_STATS: '*/5 10,11,12,13,14,15,16 12,13,15,16 12 *'
          LOCAL_SCHEDULED_DATETIME_SLOT_COUNTERS: '*/5 * * 11,12 *'
          LOCAL_SCHEDULED_FIRESTORE_BACKUP: 0 0 * 11,12 *
          LOCAL_SCHEDULED_REGISTRATION_STATS: 59 23 * * *
          LOCAL_SCHEDULED_USER_STATS: 55 23 * 11,12 *
          LOCAL_SES_REGION: us-west-2
        run: pnpm run e2e:test
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: functions-pr-e2e-failure-${{ github.run_id }}
          path: |
            santashop-e2e/test-results
            santashop-e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
