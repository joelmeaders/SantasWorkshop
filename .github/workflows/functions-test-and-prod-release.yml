name: Functions Test Deploy and Manual Prod Release

on:
  push:
    branches:
      - master
    paths:
      - 'santashop-functions/**'
      - 'santashop-models/**'
      - 'remote-config/**'
      - 'scripts/remote-config*.cjs'
      - 'scripts/email-sending.cjs'
      - 'scripts/public-parameters-schema.cjs'
      - 'scripts/load/**'
      - 'santashop-e2e/**'
      - 'firebase.json'
      - 'firebase.e2e.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'database.rules.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.env.example'
      - 'config.functions.cjs'
      - 'scripts/env-loader.cjs'
      - 'scripts/assert-functions-deploy-ci.cjs'
      - 'scripts/prepare-functions-deploy.cjs'
      - 'scripts/verify-functions-parity.cjs'
      - 'scripts/verify-functions-managed-resources.cjs'
      - 'scripts/verify-public-parameters.cjs'
      - '.github/workflows/functions-test-and-prod-release.yml'
      - '.github/workflows/functions-pr-validation.yml'

  workflow_dispatch:
    inputs:
      release_ref:
        description: Commit SHA or ref to promote after test validation
        required: true
        type: string
      deployment_target:
        description: Deployment target
        required: true
        default: prod
        type: choice
        options:
          - test
          - prod
      load_test_mode:
        description: Enable isolated load testing in test (requires provisioned network)
        required: true
        default: false
        type: boolean
      skip_tests:
        description: Skip test suites for this manual deployment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Validation artifacts and emulators never receive usable AWS credentials.
  TEST_AWS_ACCESS_KEY_ID: ci-not-used
  TEST_AWS_SECRET_ACCESS_KEY: ci-not-used
  TEST_SANTASHOP_PROGRAM_YEAR: '2026'
  TEST_SANTASHOP_TIME_ZONE: America/Denver
  TEST_SANTASHOP_SHOP_DAYS: 12-12,12-13,12-15,12-16
  TEST_SANTASHOP_DEFAULT_MAX_SLOTS: '350'
  TEST_FIRESTORE_BACKUP_BUCKET: gs://santashop-backups
  TEST_SES_REGION: us-west-2
  TEST_SANTASHOP_EVENT_DISPLAY_NAME: 2026 Denver Santa Claus Shop
  TEST_SANTASHOP_PASSWORD_RESET_CONTINUE_URL: https://test.denversantaclausshop.org/?mode=sign-in
  TEST_REMINDER_EMAIL_SENDING_STALE_MINUTES: '15'
  TEST_SANTASHOP_SIGNUP_MIN_INSTANCES: '0'
  TEST_SANTASHOP_EVENT_MIN_INSTANCES: '0'
  TEST_SANTASHOP_FUNCTIONS_SERVICE_ACCOUNT: 312672416598-compute@developer.gserviceaccount.com
  TEST_SANTASHOP_REMOTE_CONFIG_PUBLISHER_SERVICE_ACCOUNT: remote-config-publisher@santas-workshop-test.iam.gserviceaccount.com
  TEST_SANTASHOP_REMOTE_CONFIG_READER_SERVICE_ACCOUNT: remote-config-reader@santas-workshop-test.iam.gserviceaccount.com
  TEST_REGISTRATION_EMAIL_SOURCE: noreply@denversantaclausshop.org
  TEST_REGISTRATION_EMAIL_RETURN_PATH: admin@denversantaclausshop.org
  TEST_SCHEDULED_FIRESTORE_BACKUP: 0 0 * 11,12 *
  TEST_SCHEDULED_DATETIME_SLOT_COUNTERS: '*/5 * * 11,12 *'
  TEST_SCHEDULED_REGISTRATION_STATS: 59 23 * * *
  TEST_SCHEDULED_USER_STATS: 55 23 * 11,12 *
  TEST_SCHEDULED_CHECKIN_STATS: '*/5 10,11,12,13,14,15,16 12,13,15,16 12 *'
  PROD_SANTASHOP_PROGRAM_YEAR: '2026'
  PROD_SANTASHOP_TIME_ZONE: America/Denver
  PROD_SANTASHOP_SHOP_DAYS: 12-12,12-13,12-15,12-16
  PROD_SANTASHOP_DEFAULT_MAX_SLOTS: '350'
  PROD_FIRESTORE_BACKUP_BUCKET: gs://santashop-backups
  PROD_SES_REGION: us-west-2
  PROD_SANTASHOP_EVENT_DISPLAY_NAME: 2026 Denver Santa Claus Shop
  PROD_SANTASHOP_PASSWORD_RESET_CONTINUE_URL: https://register.denversantaclausshop.org/?mode=sign-in
  PROD_REMINDER_EMAIL_SENDING_STALE_MINUTES: '15'
  PROD_SANTASHOP_SIGNUP_MIN_INSTANCES: ${{ vars.PROD_SANTASHOP_SIGNUP_MIN_INSTANCES || '0' }}
  PROD_SANTASHOP_EVENT_MIN_INSTANCES: ${{ vars.PROD_SANTASHOP_EVENT_MIN_INSTANCES || '0' }}
  PROD_SANTASHOP_FUNCTIONS_SERVICE_ACCOUNT: 397997267986-compute@developer.gserviceaccount.com
  PROD_SANTASHOP_REMOTE_CONFIG_PUBLISHER_SERVICE_ACCOUNT: remote-config-publisher@santas-workshop-193b5.iam.gserviceaccount.com
  PROD_SANTASHOP_REMOTE_CONFIG_READER_SERVICE_ACCOUNT: remote-config-reader@santas-workshop-193b5.iam.gserviceaccount.com
  PROD_REGISTRATION_EMAIL_SOURCE: noreply@denversantaclausshop.org
  PROD_REGISTRATION_EMAIL_RETURN_PATH: admin@denversantaclausshop.org
  PROD_SCHEDULED_FIRESTORE_BACKUP: 0 0 * 11,12 *
  PROD_SCHEDULED_DATETIME_SLOT_COUNTERS: '*/5 * * 11,12 *'
  PROD_SCHEDULED_REGISTRATION_STATS: 59 23 * * *
  PROD_SCHEDULED_USER_STATS: 55 23 * 11,12 *
  PROD_SCHEDULED_CHECKIN_STATS: '*/5 10,11,12,13,14,15,16 12,13,15,16 12 *'

jobs:
  unit_tests:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deployment_target == 'test' && !inputs.skip_tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Check function call graph before validation or deployment
        run: pnpm run functions:graph:check
      - name: Run security audit (informational)
        id: security_audit
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm run audit:security 2>&1 | tee "$RUNNER_TEMP/security-audit.log"
      - name: Report security audit findings
        if: always() && steps.security_audit.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "::warning::Security audit reported findings or could not complete. Review the job summary and audit log."
          {
            echo '### Security audit requires review'
            echo 'This audit is informational and does not block validation or deployment.'
            echo '```text'
            cat "$RUNNER_TEMP/security-audit.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm --filter @santashop/functions run lint:check
      - run: pnpm run functions:test:unit

  integration_tests:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deployment_target == 'test' && !inputs.skip_tests)
    needs: unit_tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_TEST: ${{ secrets[format('FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_{0}', 'TEST')] }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Check integration test prerequisites
        shell: bash
        run: |
          [ -n "$FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_TEST" ] || { echo "Missing FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_TEST"; exit 1; }
      - name: Write test Firebase service account for integration tests
        shell: bash
        run: |
          printf '%s' '${{ env.FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_TEST }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Check function call graph before validation or deployment
        run: pnpm run functions:graph:check
      - name: Run security audit (informational)
        id: security_audit
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm run audit:security 2>&1 | tee "$RUNNER_TEMP/security-audit.log"
      - name: Report security audit findings
        if: always() && steps.security_audit.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "::warning::Security audit reported findings or could not complete. Review the job summary and audit log."
          {
            echo '### Security audit requires review'
            echo 'This audit is informational and does not block validation or deployment.'
            echo '```text'
            cat "$RUNNER_TEMP/security-audit.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm run functions:test:integration
      - run: pnpm run e2e:browser:setup:ci
      - name: Run customer and staff E2E tests
        env:
          LOCAL_AWS_ACCESS_KEY_ID: e2e-not-used
          LOCAL_AWS_SECRET_ACCESS_KEY: e2e-not-used
          LOCAL_FIRESTORE_BACKUP_BUCKET: gs://demo-santashop-backups
          LOCAL_REGISTRATION_EMAIL_RETURN_PATH: admin@example.invalid
          LOCAL_REGISTRATION_EMAIL_SOURCE: no-reply@example.invalid
          LOCAL_REMINDER_EMAIL_SENDING_STALE_MINUTES: '15'
          LOCAL_SANTASHOP_DEFAULT_MAX_SLOTS: '350'
          LOCAL_SANTASHOP_EVENT_DISPLAY_NAME: 2026 Denver Santa Claus Shop E2E
          LOCAL_SANTASHOP_PASSWORD_RESET_CONTINUE_URL: http://localhost:4100/?mode=sign-in
          LOCAL_SANTASHOP_EVENT_MIN_INSTANCES: '0'
          LOCAL_SANTASHOP_PROGRAM_YEAR: '2026'
          LOCAL_SANTASHOP_SHOP_DAYS: 12-12,12-13,12-15,12-16
          LOCAL_SANTASHOP_SIGNUP_MIN_INSTANCES: '0'
          LOCAL_SANTASHOP_TIME_ZONE: America/Denver
          LOCAL_SCHEDULED_CHECKIN_STATS: '*/5 10,11,12,13,14,15,16 12,13,15,16 12 *'
          LOCAL_SCHEDULED_DATETIME_SLOT_COUNTERS: '*/5 * * 11,12 *'
          LOCAL_SCHEDULED_FIRESTORE_BACKUP: 0 0 * 11,12 *
          LOCAL_SCHEDULED_REGISTRATION_STATS: 59 23 * * *
          LOCAL_SCHEDULED_USER_STATS: 55 23 * 11,12 *
          LOCAL_SES_REGION: us-west-2
        run: pnpm run e2e:test
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: functions-release-e2e-failure-${{ github.run_id }}
          path: |
            santashop-e2e/test-results
            santashop-e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  deploy_test:
    if: >-
      always() && !cancelled() && (
        (github.event_name == 'push' && needs.integration_tests.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.deployment_target == 'test' &&
          ((inputs.skip_tests && needs.integration_tests.result == 'skipped') ||
            (!inputs.skip_tests && needs.integration_tests.result == 'success')))
      )
    # Deploy on a clean runner so emulator and browser processes cannot starve Firebase predeploy.
    needs: integration_tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SANTASHOP_FUNCTIONS_DEPLOY: test
      SANTASHOP_LOAD_TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.load_test_mode && 'true' || 'false' }}
      TEST_AWS_ACCESS_KEY_ID: ${{ secrets.TEST_AWS_ACCESS_KEY_ID }}
      TEST_AWS_SECRET_ACCESS_KEY: ${{ secrets.TEST_AWS_SECRET_ACCESS_KEY }}
      FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_TEST: ${{ secrets[format('FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_{0}', 'TEST')] }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.sha }}
      - name: Record manual deployment selection
        if: github.event_name == 'workflow_dispatch' && inputs.skip_tests
        env:
          SELECTED_RELEASE_REF: ${{ inputs.release_ref }}
          SELECTED_DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
        run: |
          {
            echo '### Manual deployment'
            echo "- Selected ref: \`$SELECTED_RELEASE_REF\`"
            echo "- Target: \`$SELECTED_DEPLOYMENT_TARGET\`"
            echo '- Tests: skipped by request'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
      - name: Check test deploy prerequisites
        shell: bash
        run: |
          [ -n "$FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_TEST" ] || { echo "Missing FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_TEST"; exit 1; }
          if [ "$SANTASHOP_LOAD_TEST_MODE" != "true" ]; then
            [ -n "$TEST_AWS_ACCESS_KEY_ID" ] || { echo "Missing TEST_AWS_ACCESS_KEY_ID"; exit 1; }
            [ -n "$TEST_AWS_SECRET_ACCESS_KEY" ] || { echo "Missing TEST_AWS_SECRET_ACCESS_KEY"; exit 1; }
          fi
      - name: Write test Firebase service account
        shell: bash
        run: |
          printf '%s' '${{ env.FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_TEST }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Check function call graph before validation or deployment
        run: pnpm run functions:graph:check
      - run: pnpm run ci:functions:deploy:test
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify live test Functions match source
        shell: bash
        run: |
          for attempt in {1..12}; do
            pnpm exec firebase functions:list --project santas-workshop-test --json > "$RUNNER_TEMP/functions.json"
            if node scripts/verify-functions-parity.cjs "$RUNNER_TEMP/functions.json"; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              echo "Functions inventory has not converged yet (attempt $attempt/12); retrying in 10 seconds."
              sleep 10
            fi
          done
          exit 1
      - name: Verify live test managed trigger resources
        shell: bash
        env:
          SANTASHOP_FIREBASE_PROJECT: santas-workshop-test
          SANTASHOP_FUNCTION_REGION: us-central1
          SANTASHOP_TIME_ZONE: ${{ env.TEST_SANTASHOP_TIME_ZONE }}
          SCHEDULED_FIRESTORE_BACKUP: ${{ env.TEST_SCHEDULED_FIRESTORE_BACKUP }}
          SCHEDULED_DATETIME_SLOT_COUNTERS: ${{ inputs.load_test_mode && '*/5 * * * *' || env.TEST_SCHEDULED_DATETIME_SLOT_COUNTERS }}
          SCHEDULED_REGISTRATION_STATS: ${{ env.TEST_SCHEDULED_REGISTRATION_STATS }}
          SCHEDULED_USER_STATS: ${{ env.TEST_SCHEDULED_USER_STATS }}
          SCHEDULED_CHECKIN_STATS: ${{ env.TEST_SCHEDULED_CHECKIN_STATS }}
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud scheduler jobs list --project="$SANTASHOP_FIREBASE_PROJECT" --location="$SANTASHOP_FUNCTION_REGION" --format=json > "$RUNNER_TEMP/scheduler.json"
          gcloud tasks queues list --project="$SANTASHOP_FIREBASE_PROJECT" --location="$SANTASHOP_FUNCTION_REGION" --format=json > "$RUNNER_TEMP/tasks.json"
          gcloud eventarc triggers list --project="$SANTASHOP_FIREBASE_PROJECT" --location=nam5 --format=json > "$RUNNER_TEMP/eventarc.json"
          node scripts/verify-functions-managed-resources.cjs "$RUNNER_TEMP/scheduler.json" "$RUNNER_TEMP/tasks.json" "$RUNNER_TEMP/eventarc.json"
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error --header "Authorization: Bearer $ACCESS_TOKEN" "https://firebaseremoteconfig.googleapis.com/v1/projects/$SANTASHOP_FIREBASE_PROJECT/remoteConfig" > "$RUNNER_TEMP/public-parameters.json"
          node scripts/verify-public-parameters.cjs "$RUNNER_TEMP/public-parameters.json"

  deploy_prod:
    if: github.event_name == 'workflow_dispatch' && inputs.deployment_target == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SANTASHOP_FUNCTIONS_DEPLOY: prod
      SANTASHOP_LOAD_TEST_MODE: ${{ inputs.load_test_mode && 'true' || 'false' }}
      FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_193B5: ${{ secrets[format('FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_{0}', '193B5')] }}
      PROD_AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
      PROD_AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}
      - name: Record manual deployment selection
        if: inputs.skip_tests
        env:
          SELECTED_RELEASE_REF: ${{ inputs.release_ref }}
          SELECTED_DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
        run: |
          {
            echo '### Manual deployment'
            echo "- Selected ref: \`$SELECTED_RELEASE_REF\`"
            echo "- Target: \`$SELECTED_DEPLOYMENT_TARGET\`"
            echo '- Tests: skipped by request'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
      - name: Check production deploy prerequisites
        shell: bash
        run: |
          [ -n "$FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_193B5" ] || { echo "Missing FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_193B5"; exit 1; }
          [ -n "$PROD_AWS_ACCESS_KEY_ID" ] || { echo "Missing PROD_AWS_ACCESS_KEY_ID"; exit 1; }
          [ -n "$PROD_AWS_SECRET_ACCESS_KEY" ] || { echo "Missing PROD_AWS_SECRET_ACCESS_KEY"; exit 1; }
      - name: Write production Firebase service account
        shell: bash
        run: |
          printf '%s' '${{ env.FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_193B5 }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Check function call graph before validation or deployment
        run: pnpm run functions:graph:check
      - name: Run security audit (informational)
        id: security_audit
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm run audit:security 2>&1 | tee "$RUNNER_TEMP/security-audit.log"
      - name: Report security audit findings
        if: always() && steps.security_audit.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "::warning::Security audit reported findings or could not complete. Review the job summary and audit log."
          {
            echo '### Security audit requires review'
            echo 'This audit is informational and does not block validation or deployment.'
            echo '```text'
            cat "$RUNNER_TEMP/security-audit.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm --filter @santashop/functions run lint:check
      - run: pnpm run functions:test:unit
        if: inputs.skip_tests == false
      - run: pnpm run ci:functions:deploy:prod
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify live production Functions match source
        shell: bash
        run: |
          pnpm exec firebase functions:list --project santas-workshop-193b5 --json > "$RUNNER_TEMP/functions.json"
          node scripts/verify-functions-parity.cjs "$RUNNER_TEMP/functions.json"
      - name: Verify live production managed trigger resources
        shell: bash
        env:
          SANTASHOP_FIREBASE_PROJECT: santas-workshop-193b5
          SANTASHOP_FUNCTION_REGION: us-central1
          SANTASHOP_TIME_ZONE: ${{ env.PROD_SANTASHOP_TIME_ZONE }}
          SCHEDULED_FIRESTORE_BACKUP: ${{ env.PROD_SCHEDULED_FIRESTORE_BACKUP }}
          SCHEDULED_DATETIME_SLOT_COUNTERS: ${{ env.PROD_SCHEDULED_DATETIME_SLOT_COUNTERS }}
          SCHEDULED_REGISTRATION_STATS: ${{ env.PROD_SCHEDULED_REGISTRATION_STATS }}
          SCHEDULED_USER_STATS: ${{ env.PROD_SCHEDULED_USER_STATS }}
          SCHEDULED_CHECKIN_STATS: ${{ env.PROD_SCHEDULED_CHECKIN_STATS }}
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud scheduler jobs list --project="$SANTASHOP_FIREBASE_PROJECT" --location="$SANTASHOP_FUNCTION_REGION" --format=json > "$RUNNER_TEMP/scheduler.json"
          gcloud tasks queues list --project="$SANTASHOP_FIREBASE_PROJECT" --location="$SANTASHOP_FUNCTION_REGION" --format=json > "$RUNNER_TEMP/tasks.json"
          gcloud eventarc triggers list --project="$SANTASHOP_FIREBASE_PROJECT" --location=nam5 --format=json > "$RUNNER_TEMP/eventarc.json"
          node scripts/verify-functions-managed-resources.cjs "$RUNNER_TEMP/scheduler.json" "$RUNNER_TEMP/tasks.json" "$RUNNER_TEMP/eventarc.json"
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error --header "Authorization: Bearer $ACCESS_TOKEN" "https://firebaseremoteconfig.googleapis.com/v1/projects/$SANTASHOP_FIREBASE_PROJECT/remoteConfig" > "$RUNNER_TEMP/public-parameters.json"
          node scripts/verify-public-parameters.cjs "$RUNNER_TEMP/public-parameters.json"
