name: Verify immutable release evidence
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      mode:
        required: true
        type: string
      release_ref:
        required: true
        type: string
      skip_tests:
        type: boolean
        default: false
      evidence_run_ids:
        type: string
        default: ''
      production_approval:
        type: string
        default: ''
    outputs:
      sha:
        value: ${{ jobs.verify.outputs.sha }}
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      # This is workflow source, never the unchecked release_ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
      - name: Verify exact release evidence before candidate execution
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_ref }}
          RELEASE_UNIT: ${{ inputs.target }}
          RELEASE_MODE: ${{ inputs.mode }}
          SKIP_TESTS: ${{ inputs.skip_tests }}
          EVIDENCE_RUN_IDS: ${{ inputs.evidence_run_ids }}
          PRODUCTION_APPROVAL: ${{ inputs.production_approval }}
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_ACTOR: ${{ github.triggering_actor }}
        run: node scripts/release-evidence.mjs
