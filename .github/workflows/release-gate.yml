name: Verify immutable release evidence
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      mode:
        required: true
        type: string
      release_ref:
        required: true
        type: string
    outputs:
      sha:
        value: ${{ jobs.verify.outputs.sha }}
      reuse_tests:
        value: ${{ jobs.verify.outputs.reuse_tests }}
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      reuse_tests: ${{ steps.verify.outputs.reuse_tests }}
    steps:
      # This is workflow source, never the unchecked release_ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
      - name: Verify exact release evidence before candidate execution
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref }}
          RELEASE_UNIT: ${{ inputs.target }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_ACTOR: ${{ github.triggering_actor }}
        run: node scripts/release-evidence.mjs
