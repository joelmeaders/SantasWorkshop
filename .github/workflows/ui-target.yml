name: UI target validation and release
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      mode:
        required: true
        type: string
      release_ref:
        required: true
        type: string
      deploy:
        type: boolean
        default: false
      reuse_tests:
        type: boolean
        default: false
      shared_tests:
        type: boolean
        default: true
    secrets:
      TEST_FIREBASE_API_KEY:
        required: false
      PROD_FIREBASE_API_KEY:
        required: false
      FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_TEST:
        required: false
      FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_193B5:
        required: false
permissions:
  contents: read
env:
  TEST_SANTASHOP_PROGRAM_YEAR: '2026'
  TEST_SANTASHOP_SHOP_DAYS: 12-12,12-13,12-15,12-16
  LOCAL_AWS_ACCESS_KEY_ID: e2e-not-used
  LOCAL_AWS_SECRET_ACCESS_KEY: e2e-not-used
  LOCAL_FIRESTORE_BACKUP_BUCKET: gs://demo-santashop-backups
  LOCAL_REGISTRATION_EMAIL_RETURN_PATH: admin@example.invalid
  LOCAL_REGISTRATION_EMAIL_SOURCE: no-reply@example.invalid
  LOCAL_REMINDER_EMAIL_SENDING_STALE_MINUTES: '15'
  LOCAL_SANTASHOP_DEFAULT_MAX_SLOTS: '350'
  LOCAL_SANTASHOP_EVENT_DISPLAY_NAME: 2026 Denver Santa Claus Shop E2E
  LOCAL_SANTASHOP_PASSWORD_RESET_CONTINUE_URL: http://localhost:4100/?mode=sign-in
  LOCAL_SANTASHOP_EVENT_MIN_INSTANCES: '0'
  LOCAL_SANTASHOP_PROGRAM_YEAR: '2026'
  LOCAL_SANTASHOP_SHOP_DAYS: 12-12,12-13,12-15,12-16
  LOCAL_SANTASHOP_SIGNUP_MIN_INSTANCES: '0'
  LOCAL_SANTASHOP_TIME_ZONE: America/Denver
  LOCAL_SCHEDULED_CHECKIN_STATS: '*/5 10,11,12,13,14,15,16 12,13,15,16 12 *'
  LOCAL_SCHEDULED_DATETIME_SLOT_COUNTERS: '*/5 * * 11,12 *'
  LOCAL_SCHEDULED_FIRESTORE_BACKUP: 0 0 * 11,12 *
  LOCAL_SCHEDULED_REGISTRATION_STATS: 59 23 * * *
  LOCAL_SCHEDULED_USER_STATS: 55 23 * 11,12 *
  LOCAL_SES_REGION: us-west-2
  TEST_FIREBASE_AUTH_DOMAIN: santas-workshop-test.firebaseapp.com
  TEST_FIREBASE_DATABASE_URL: https://santas-workshop-test-default-rtdb.firebaseio.com
  TEST_FIREBASE_PROJECT_ID: santas-workshop-test
  TEST_FIREBASE_STORAGE_BUCKET: santas-workshop-test.appspot.com
  TEST_FIREBASE_MESSAGING_SENDER_ID: '312672416598'
  TEST_FIREBASE_APP_ID: 1:312672416598:web:75721875d43341bef29cf7
  TEST_FIREBASE_MEASUREMENT_ID: G-4FQR667VT9
  PROD_FIREBASE_AUTH_DOMAIN: santas-workshop-193b5.firebaseapp.com
  PROD_FIREBASE_DATABASE_URL: https://santas-workshop-193b5.firebaseio.com
  PROD_FIREBASE_PROJECT_ID: santas-workshop-193b5
  PROD_FIREBASE_STORAGE_BUCKET: santas-workshop-193b5.appspot.com
  PROD_FIREBASE_MESSAGING_SENDER_ID: '397997267986'
  PROD_FIREBASE_APP_ID: 1:397997267986:web:8c85e08550793dd348cccb
  PROD_FIREBASE_MEASUREMENT_ID: G-0KHS1T1W85
  PROD_SANTASHOP_PROGRAM_YEAR: '2026'
  PROD_SANTASHOP_SHOP_DAYS: 12-12,12-13,12-15,12-16
  UI_TARGET: ${{ inputs.target }}
  UI_MODE: ${{ inputs.mode }}

jobs:
  validate_release:
    runs-on: ubuntu-latest
    env:
      TEST_FIREBASE_API_KEY: ${{ inputs.mode == 'test' && secrets.TEST_FIREBASE_API_KEY || '' }}
      PROD_FIREBASE_API_KEY: ${{ inputs.mode == 'prod' && secrets.PROD_FIREBASE_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false
      - name: Capture checkout revision before candidate code
        id: revision
        env:
          EXPECTED_SHA: ${{ inputs.release_ref }}
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SHA"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - name: Release revision ${{ steps.revision.outputs.sha }}
        run: echo 'Checkout revision recorded before candidate execution'
      - name: Validate target and record verified test reuse
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          DEPLOY: ${{ inputs.deploy }}
          REUSE_TESTS: ${{ inputs.reuse_tests }}
        run: |
          case "$UI_TARGET:$UI_MODE" in app:test|app:prod|admin:test|admin:prod) ;; *) exit 1 ;; esac
          if [ "$REUSE_TESTS" = true ]; then
            test "$DEPLOY" = true
            {
              echo '### Manual deployment'
              printf 'Selected ref: `%s`\nTarget: `%s/%s`\nTests: automatically discovered exact-SHA evidence reused\n' "$RELEASE_REF" "$UI_TARGET" "$UI_MODE"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: pnpm
      - uses: actions/setup-java@v6
        if: ${{ inputs.deploy && !inputs.reuse_tests }}
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run e2e:browser:setup:ci
        if: ${{ !inputs.reuse_tests }}
      - run: pnpm run "config:$UI_TARGET:$UI_MODE"
      - name: Prepare shared libraries before unit tests
        run: pnpm run storybook:prepare
      - name: Run shared core tests for this standalone release
        if: ${{ !inputs.reuse_tests && inputs.shared_tests }}
        run: pnpm run ci:core:test
      - name: Run target unit tests with prepared shared libraries
        if: ${{ !inputs.reuse_tests }}
        run: pnpm --filter "@santashop/$UI_TARGET" test
      - name: Load validated Remote Config release defaults
        if: ${{ inputs.deploy }}
        env:
          REMOTE_CONFIG_SERVICE_ACCOUNT: ${{ secrets[format('FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_{0}', inputs.mode == 'prod' && '193B5' || 'TEST')] }}
        run: |
          project=santas-workshop-test
          if [ "$UI_MODE" = prod ]; then project=santas-workshop-193b5; fi
          node scripts/remote-config.cjs release-defaults --project "$project"
      - run: pnpm run "ci:$UI_TARGET:build:$UI_MODE"
      - name: Record verified Hosting output before emulator tests
        if: ${{ inputs.deploy && !inputs.reuse_tests }}
        run: |
          set -o pipefail
          rg --files --hidden --no-ignore --null "dist/santashop-$UI_TARGET" | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/hosting-before-e2e.sha256"
      # PR browser tests run once in the caller, after all fast checks.
      # Release browser preparation changes source config but does not write
      # dist/santashop-app or dist/santashop-admin, the verified Hosting output.
      - name: Customer or staff E2E tests
        run: pnpm run "e2e:test:$UI_TARGET"
        if: ${{ inputs.deploy && !inputs.reuse_tests }}
      - name: Upload E2E failure artifacts
        if: ${{ failure() && inputs.deploy && !inputs.reuse_tests }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-${{ inputs.target }}-${{ inputs.mode }}-e2e-${{ github.run_id }}
          path: |
            santashop-e2e/test-results
            santashop-e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Restore release source configuration after emulator tests
        if: ${{ inputs.deploy && !inputs.reuse_tests }}
        run: pnpm run "config:$UI_TARGET:$UI_MODE"
      - name: Require unchanged verified Hosting output
        if: ${{ inputs.deploy && !inputs.reuse_tests }}
        run: |
          set -o pipefail
          rg --files --hidden --no-ignore --null "dist/santashop-$UI_TARGET" | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/hosting-after-e2e.sha256"
          cmp "$RUNNER_TEMP/hosting-before-e2e.sha256" "$RUNNER_TEMP/hosting-after-e2e.sha256"
      - uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        if: ${{ inputs.deploy }}
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets[format('FIREBASE_SERVICE_ACCOUNT_SANTAS_WORKSHOP_{0}', inputs.mode == 'prod' && '193B5' || 'TEST')] }}
          channelId: live
          target: santashop-${{ inputs.target }}
          projectId: ${{ inputs.mode == 'prod' && 'santas-workshop-193b5' || 'santas-workshop-test' }}
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels

      - name: Test deployment ${{ inputs.target }} santas-workshop-test
        if: ${{ inputs.deploy && inputs.mode == 'test' }}
        run: echo 'Test Hosting deployment succeeded'
      - name: Record production deployment result
        if: ${{ always() && inputs.deploy && inputs.mode == 'prod' }}
        env:
          RELEASE_SHA: ${{ inputs.release_ref }}
          DEPLOYMENT_STATUS: ${{ job.status }}
        run: |
          printf 'Production Hosting deployment for `%s` (%s): %s\n' "$RELEASE_SHA" "$UI_TARGET" "$DEPLOYMENT_STATUS" >> "$GITHUB_STEP_SUMMARY"
