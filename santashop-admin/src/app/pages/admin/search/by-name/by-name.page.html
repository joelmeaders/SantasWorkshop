<admin-header title="Search: Last Name & Zip"
	backRoute="/admin/search"
 />

<ion-content fullscreen class="ion-padding">
	<main class="limited-container">
		<ion-card-header>
			<ion-card-title> Step 2 </ion-card-title>
			<ion-card-subtitle>
				Enter last name and zip code
			</ion-card-subtitle>
		</ion-card-header>
		<form [formGroup]="form">
			<ion-list>
				<ion-item>
					<ion-input type="text"
						label="Last name"
						labelPlacement="fixed"
						formControlName="lastName"
						maxlength="20"
						minlength="2"
						autocomplete="off"
						placeholder="required"
					 />
					@if (form.controls['lastName'].touched &&
					form.controls['lastName'].invalid) {
					<ion-note slot="error">
						Invalid last name. 2-20 characters
					</ion-note>
					}
				</ion-item>
				<ion-item counter>
					<ion-input type="number"
						label="Zip code"
						labelPlacement="fixed"
						maxlength="5"
						minlength="5"
						formControlName="zipCode"
						autocomplete="off"
						placeholder="required"
					 />
					@if (form.controls['zipCode'].touched &&
					form.controls['zipCode'].invalid) {
					<ion-note slot="error">
						Invalid zip code. Must have 5 digits
					</ion-note>
					}
				</ion-item>
			</ion-list>
		</form>
		<div class="search-buttons">
			<ion-button color="danger" (click)="reset()" routerLink="..">
				<ion-icon name="backspace-outline" slot="start" aria-hidden="true" />
				<ion-label> Reset </ion-label>
			</ion-button>
			<ion-button
				(click)="search()"
				routerLink="../results"
				[disabled]="!form.valid"
			>
				<ion-icon name="search-outline" slot="start" aria-hidden="true" />
				<ion-label> Search </ion-label>
			</ion-button>
		</div>
	</main>
</ion-content>
