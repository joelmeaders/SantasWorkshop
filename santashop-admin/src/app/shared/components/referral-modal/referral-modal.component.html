<ion-header>
	<ion-toolbar>
		<ion-title> Choose Referring Agency</ion-title>
		<ion-button
			slot="end"
			fill="outline"
			color="danger"
			(click)="dismiss()"
		>
			Cancel
		</ion-button>
	</ion-toolbar>
</ion-header>

<ion-content>
	@if (referralChoice() === undefined) {
		<ion-list>
			<ion-searchbar
				(ionInput)="filter($event)"
				animated="true"
				placeholder="Enter agency name"
			/>
			<ion-item-group>
				<ion-item-divider color="light" disabled>
					<ion-label> Common </ion-label>
				</ion-item-divider>
				@for (ref of referrals(); track ref; let i = $index) {
					@if (ref === '----------') {
						<ion-item-divider disabled color="light">
							<ion-label>
								{{ i < 10 ? 'Alphabetical' : '' }}
							</ion-label>
						</ion-item-divider>
					} @else {
						<ion-item
							button
							detail
							lines="full"
							(click)="setValue(ref)"
							[disabled]="ref === '----------'"
						>
							<ion-label class="ref-choices">{{ ref }}</ion-label>
						</ion-item>
					}
					<ng-template #agency>
						<ion-item
							button
							detail
							lines="full"
							(click)="setValue(ref)"
							[disabled]="ref === '----------'"
						>
							<ion-label class="ref-choices">{{ ref }}</ion-label>
						</ion-item>
					</ng-template>
				}
			</ion-item-group>
		</ion-list>
	}

	@if (referralChoice() === 'Other') {
		<ion-item lines="none">
			<ion-input
				[value]="otherName()"
				(ionInput)="otherName.set($event.detail.value ?? '')"
				class="other-input"
				label="Type name of referral:"
				labelPlacement="stacked"
				maxlength="20"
				minlength="3"
			/>
		</ion-item>
		<ion-button
			expand="block"
			size="default"
			[disabled]="!validOtherName()"
			(click)="saveOther()"
		>
			Save
		</ion-button>
	}
</ion-content>
