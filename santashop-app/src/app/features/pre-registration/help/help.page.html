<ion-content color="light">
	<ion-grid class="height-max es-mg-bottom-xxl">
		<ion-row class="height-max ion-justify-content-center">
			<ion-col
				sizeXl="9"
				sizeLg="12"
				sizeMd="12"
				sizeSm="12"
				sizeXs="12"
				size="12"
			>
				<ion-row class="ion-justify-content-center">
					<ion-col sizeXs="12" sizeSm="7">
						<ion-button
							class="remove-shadow customer-back-button"
							color="white"
							[attr.aria-label]="'COMMON.GO_BACK' | translate"
							(click)="close()"
						>
							<ion-icon slot="start"
								name="arrow-back-sharp"
								aria-hidden="true"
							 />
							<ion-label>{{ 'COMMON.GO_BACK' | translate }}</ion-label>
						</ion-button>

						<ion-card>
							<ion-card-header>
								<ion-item
									class="inset-ion-item-title"
									color="white"
								>
									<ion-card-title lines="full">
										{{ "HELP.TITLE" | translate }}
									</ion-card-title>
								</ion-item>
							</ion-card-header>
							<ion-card-content>
								<div class="ion-padding">
									{{ "HELP.VISIT_TEXT" | translate }}
								</div>

								<div
									class="ion-padding ion-text-center es-mg-bottom-xxl"
								>
									<ion-button
										color="xmasred"
										href="https://www.denversantaclausshop.org/contact/"
										target="_blank"
									>
										{{ "HELP.VISIT_BUTTON" | translate }}
									</ion-button>
								</div>

								<div
									class="ion-text-center es-mg-top-xxl es-mg-bottom-xxl"
								>
									<ion-text color="xmasred">
									<strong>—</strong>
									</ion-text>
								</div>

								<div class="ion-padding">
									{{ "HELP.PDF_GUIDE_TEXT" | translate }}
								</div>

								<div class="ion-text-center es-pd-bottom-xxl">
									<ion-button
										color="xmasred"
										href="https://www.denversantaclausshop.org/wp-content/uploads/2021/11/DSCS-App-Help-Guide-1.pdf"
										target="_blank"
									>
										{{ "HELP.PDF_GUIDE_BUTTON" | translate
										}}
									</ion-button>
								</div>
							</ion-card-content>
						</ion-card>

						<div class="ion-padding es-mg-bottom-xxl"></div>
					</ion-col>
				</ion-row>
			</ion-col>
		</ion-row>
	</ion-grid>
</ion-content>
