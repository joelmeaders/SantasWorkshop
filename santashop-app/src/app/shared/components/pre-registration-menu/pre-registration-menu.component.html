<ng-container
	*appLet="isRegistrationComplete$ | async as isRegistrationComplete"
>
	@if (!isRegistrationComplete) {
		<ion-tab-bar>
			<ng-container *appLet="childCount$ | async as childCount">
				<ion-tab-button tab="overview" layout="icon-start">
					<ion-icon name="home" />
					<ion-label>{{ 'MENU.HOME' | translate }}</ion-label>
				</ion-tab-button>
				@if (!isRegistrationComplete) {
					<ion-tab-button tab="children" layout="icon-start">
						<ion-icon name="accessibility" />
						<ion-label>{{ 'MENU.CHILDREN' | translate }}</ion-label>
					</ion-tab-button>
				}
				@if (!isRegistrationComplete) {
					<ion-tab-button
						tab="date-time"
						layout="icon-start"
						[disabled]="!childCount"
					>
						<ion-icon name="calendar-outline" />
						<ion-label>{{ 'MENU.SCHEDULE' | translate }}</ion-label>
					</ion-tab-button>
				}
				<ng-container *appLet="chosenSlot$ | async as chosenSlot">
					@if (!isRegistrationComplete) {
						<ion-tab-button
							tab="submit"
							layout="icon-start"
							[disabled]="!childCount || !chosenSlot"
						>
							<ion-icon name="send-outline" />
							<ion-label>{{
								'MENU.SUBMIT' | translate
							}}</ion-label>
						</ion-tab-button>
					}
				</ng-container>
			</ng-container>
		</ion-tab-bar>
	}
</ng-container>
