<ion-content>
	@if (isLoggedIn$ | async) {
		<ion-list lines="none" class="ion-text-center">
			<ion-item
				button
				tappable
				(click)="profile()"
				(keyup.enter)="profile()"
				class="ion-text-center"
			>
				<ion-label>
					{{ 'COMMON.MY_ACCOUNT' | translate }}
				</ion-label>
			</ion-item>
			<ion-item class="ion-text-center">
				<app-language-toggle />
			</ion-item>
			<ion-item
				button
				tappable
				(click)="help()"
				(keyup.enter)="help()"
				class="ion-text-center"
			>
				<ion-label>
					{{ 'COMMON.HELP' | translate }}
				</ion-label>
			</ion-item>
			<ion-item
				id="signOutButton"
				button
				tappable
				(click)="logout()"
				(keyup.enter)="logout()"
				class="ion-text-center"
			>
				<ion-label>
					{{ 'COMMON.SIGN_OUT' | translate }}
				</ion-label>
			</ion-item>
			<ion-item
				button
				tappable
				href="https://www.denversantaclausshop.org/"
				target="_blank"
				class="ion-text-center"
				(click)="closeMenu()"
				(keyup.enter)="closeMenu()"
			>
				<ion-label> {{ 'COMMON.OUR_WEBSITE' | translate }} </ion-label>
			</ion-item>
		</ion-list>
	}
</ion-content>
