      <rect width="8" height="16" fill="#ffcf43"/>
      <rect x="8" width="8" height="16" fill="#ff725e"/>
    </pattern>
  </defs>
  <ellipse cx="128" cy="225" rx="87" ry="13" fill="#1b437a" opacity=".16"/>
