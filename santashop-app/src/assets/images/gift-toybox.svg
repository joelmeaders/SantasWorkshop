<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Playful toy-box Christmas gift</title>
  <desc id="desc">A cheerful blue present with colorful dots, a striped ribbon, and a whimsical bow.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42c7e8"/>
      <stop offset="1" stop-color="#1766bf"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a66cf4"/>
      <stop offset="1" stop-color="#5a2aa5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#13376b" flood-opacity=".25"/>
    </filter>
